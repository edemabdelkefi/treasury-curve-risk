[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treasury-curve-risk"
version = "0.1.0"
description = "Reproducible mathematical and quantitative research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pandas>=2.2", "scipy>=1.12"]

[project.scripts]
run-experiment = "curve_risk.experiment:run"

[tool.setuptools.packages.find]
where = ["src"]
